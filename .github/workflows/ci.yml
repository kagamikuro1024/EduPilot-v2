name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: go vet
        run: go vet ./...
      - name: go vet (testroutes)
        run: go vet -tags testroutes ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend-go
      - name: golangci-lint (testroutes)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend-go
          args: --build-tags testroutes
      - name: setup sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: '1.31.1'
      - name: sqlc diff
        run: sqlc diff
      - name: go test -race (testroutes)
        run: go test -race -tags testroutes ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm -C frontend lint
      - name: ui antipatterns
        run: bash scripts/ui-antipatterns.sh
      - name: lint selftest
        run: bash scripts/lint-selftest.sh
      - name: build (như production)
        run: pnpm -C frontend build
      - name: build (gate)
        run: pnpm -C frontend build:gate
      - name: cache playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: playwright install chromium
        run: pnpm -C frontend exec playwright install --with-deps chromium
      - name: playwright test
        run: pnpm -C frontend exec playwright test --grep-invert @real
      - name: lighthouse ci
        run: pnpm -C frontend exec lhci autorun
      - name: upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-reports
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/.lighthouseci
          if-no-files-found: ignore
