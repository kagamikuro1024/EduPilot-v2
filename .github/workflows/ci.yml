name: CI

on:
  push:
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]

# Một lượt chạy mỗi nhánh: push mới huỷ lượt cũ đang chạy của cùng nhánh.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    # TL-CI #1: lọc theo đường dẫn ở mức job. PR và push vào main, nhánh mới / force-push (before không còn trong lịch sử) LUÔN chạy đủ.
    runs-on: ubuntu-24.04
    outputs:
      fe: ${{ steps.f.outputs.fe }}
      go: ${{ steps.f.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: selftest bộ lọc
        run: bash scripts/ci-changes.sh --selftest
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: bash scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache: false # TL-CI #4: cache do job này tự quản (setup-go ghi khoá chung với Judge: bản ghi sớm của Judge thiếu module và không bao giờ được ghi lại)
      - name: go cache paths
        id: gopath
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: cache module Go
        uses: actions/cache@v5
        with:
          path: ${{ steps.gopath.outputs.mod }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('backend-go/go.sum') }}
      - name: cache biên dịch Go
        # Khoá có run_id nên mỗi lượt GHI lại; restore-keys khôi phục bản gần nhất của cùng go.sum.
        uses: actions/cache@v5
        with:
          path: ${{ steps.gopath.outputs.build }}
          key: go-build-${{ runner.os }}-${{ hashFiles('backend-go/go.sum') }}-${{ github.run_id }}
          restore-keys: go-build-${{ runner.os }}-${{ hashFiles('backend-go/go.sum') }}-
      - name: go vet
        run: go vet ./...
      - name: go vet (testroutes)
        run: go vet -tags testroutes ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend-go
      - name: golangci-lint (testroutes)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend-go
          args: --build-tags testroutes
      - name: setup sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: '1.31.1'
      - name: sqlc diff
        run: sqlc diff
      - name: go test -race (testroutes)
        # internal/testutil dùng chung container (tên cố định, Reuse) giữa các gói test chạy song song. Ryuk giết container khi
        # tiến trình ĐÃ TẠO ra nó thoát — các gói còn lại gặp "connection refused" giữa chừng (CI đỏ ngẫu nhiên). Runner dùng một lần nên tắt Ryuk.
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          EP_SKIP_TIMING: "1"
        run: go test -race -tags testroutes ./...
      - name: go test (đo thời gian, tuần tự, không -race)
        # Các test `*TimingEqualized` bị bỏ qua ở bước trên bằng EP_SKIP_TIMING=1 (không dùng -short: cờ đó bỏ qua mọi test cần container) (đo mili-giây không ổn định khi nhiều gói chạy song song). Chạy riêng, một gói một lúc, ngưỡng giữ nguyên (TL-3).
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -p 1 -count=3 -tags testroutes -run 'TimingEqualized$' ./internal/auth/ ./internal/course/

  judge-attacks:
    name: Judge attacks (amd64, seccomp bật)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    # US-PE-02 AC3/AC5: 15 đòn tấn công (A1–A15) trên go-judge thật, KHÔNG -no-seccomp. runner ubuntu-24.04 là amd64.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache: false # chỉ khôi phục (bên dưới); job Go ghi cache, để bản ghi thiếu module của Judge không chiếm khoá
      - name: go cache paths
        id: gopath
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        with:
          path: ${{ steps.gopath.outputs.mod }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('backend-go/go.sum') }}
      - uses: actions/cache/restore@v5
        with:
          path: ${{ steps.gopath.outputs.build }}
          key: go-build-${{ runner.os }}-${{ hashFiles('backend-go/go.sum') }}-none
          restore-keys: go-build-${{ runner.os }}-${{ hashFiles('backend-go/go.sum') }}-
      - name: go test -tags integration ./internal/judge
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -race -tags integration ./internal/judge -timeout 15m

  fe-check:
    name: Frontend (lint + build)
    needs: changes
    if: needs.changes.outputs.fe == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/fe-setup
      - name: lint
        run: pnpm -C frontend lint
      - name: ui antipatterns
        run: bash scripts/ui-antipatterns.sh
      - name: lint selftest
        run: bash scripts/lint-selftest.sh
      - name: build (như production)
        run: pnpm -C frontend build

  e2e:
    name: Frontend e2e (Playwright)
    needs: changes
    if: needs.changes.outputs.fe == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/fe-setup
        with:
          browsers: "true"
      - name: build (gate)
        run: pnpm -C frontend build:gate
      - name: playwright test
        run: pnpm -C frontend exec playwright test --grep-invert @real
      - name: upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-reports
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  lhci:
    name: Frontend Lighthouse
    needs: changes
    if: needs.changes.outputs.fe == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/fe-setup
        with:
          browsers: "true"
      - name: build (gate)
        run: pnpm -C frontend build:gate
      - name: lighthouse ci
        # lhci cần một Chrome: dùng đúng Chromium của Playwright (cùng phiên bản với bộ test).
        run: |
          export CHROME_PATH="$(pnpm -C frontend exec node -p "require('@playwright/test').chromium.executablePath()")"
          echo "CHROME_PATH=$CHROME_PATH"
          pnpm -C frontend exec lhci autorun
      - name: lighthouse ci (devtools, chỉ LCP)
        # US-PU-06 / góp ý #14 (b'): LCP đo bằng throttle THẬT (devtools), vì mô phỏng (simulate) tính cả ~254 KB JS vào đồ thị LCP kể cả khi chữ đã có trong HTML.
        # Lượt simulate ở trên giữ TBT / CLS / dung lượng JS (4× và ngưỡng không đổi); LCP ở đó không chấm.
        run: |
          export CHROME_PATH="$(pnpm -C frontend exec node -p "require('@playwright/test').chromium.executablePath()")"
          pnpm -C frontend exec lhci autorun --config=lighthouserc.devtools.json
      - name: lighthouse benchmark (chẩn đoán máy chạy)
        if: always()
        run: |
          node -e "
          const fs=require('fs');const d='frontend/.lighthouseci';
          if(!fs.existsSync(d))process.exit(0);
          for(const f of fs.readdirSync(d).filter(f=>/^lhr-.*\.json$/.test(f))){
            const r=JSON.parse(fs.readFileSync(d+'/'+f));
            console.log(new URL(r.finalUrl).pathname.padEnd(14),'benchmarkIndex',r.environment.benchmarkIndex,'TBT',Math.round(r.audits['total-blocking-time'].numericValue),'LCP',Math.round(r.audits['largest-contentful-paint'].numericValue),'cpuSlowdown',r.configSettings.throttling.cpuSlowdownMultiplier);
          }"
      - name: upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lhci-reports
          path: |
            frontend/.lighthouseci
            frontend/.lighthouseci-devtools
          include-hidden-files: true # frontend/.lighthouseci là thư mục ẩn: không có cờ này báo cáo Lighthouse không được tải lên
          if-no-files-found: ignore
