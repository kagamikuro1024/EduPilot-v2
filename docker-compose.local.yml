# Stack dev local (D48, SRS 8.4). Chạy qua `pnpm dev`; tên project: edupilot.
# Mọi giá trị nhạy cảm là ${BIEN} lấy từ .env.local (tạo từ .env.example).

# Biến môi trường chung của gateway / worker. Giá trị để trống = dùng mặc định của platform/config.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-}
  DATABASE_URL: ${DATABASE_URL}
  PGBOUNCER_URL: ${PGBOUNCER_URL}
  REDIS_URL: ${REDIS_URL}
  DB_MAX_CONNS: ${DB_MAX_CONNS:-}
  DB_SLOW_QUERY_MS: ${DB_SLOW_QUERY_MS:-}
  STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  BLOB_ENDPOINT: ${BLOB_ENDPOINT}
  BLOB_BUCKET: ${BLOB_BUCKET}
  BLOB_ACCESS_KEY: ${BLOB_ACCESS_KEY}
  BLOB_SECRET_KEY: ${BLOB_SECRET_KEY}
  BLOB_USE_SSL: ${BLOB_USE_SSL:-}
  BLOB_PUBLIC_ENDPOINT: ${BLOB_PUBLIC_ENDPOINT:-}
  BLOB_REGION: ${BLOB_REGION:-}

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["${EP_PORT_POSTGRES:-5433}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgbouncer:
    # Image cộng đồng cấu hình bằng biến môi trường (QUESTIONS.md Q12), ghim phiên bản.
    # Cấu hình hiệu lực ở deploy/pgbouncer/pgbouncer.ini (SRS 8.3); entrypoint chỉ sinh userlist.txt
    # từ DATABASE_URLS nên không có mật khẩu nào nằm trong file này hay trong image.
    image: edoburu/pgbouncer:v1.26.0-p0
    environment:
      AUTH_TYPE: scram-sha-256
      DATABASE_URLS: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB},postgres://${PGBOUNCER_STATS_USER}:${PGBOUNCER_STATS_PASSWORD}@postgres:5432/
      PGBOUNCER_STATS_USER: ${PGBOUNCER_STATS_USER}
      PGBOUNCER_STATS_PASSWORD: ${PGBOUNCER_STATS_PASSWORD}
    volumes: ["./deploy/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "psql \"postgres://$${PGBOUNCER_STATS_USER}:$${PGBOUNCER_STATS_PASSWORD}@127.0.0.1:6432/pgbouncer\" -Atc 'SHOW VERSION' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports: ["${EP_PORT_REDIS:-6380}:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # minio/minio (Docker Hub, quay.io) đã ngừng phát hành; dùng bản fork cộng đồng cùng API S3 (xem proposals.md #3).
    # Bucket do gateway tự tạo lúc khởi động khi APP_ENV ≠ production (SRS 8.1).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BLOB_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BLOB_SECRET_KEY}
    ports: ["${EP_PORT_MINIO:-9000}:9000", "${EP_PORT_MINIO_CONSOLE:-9001}:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["${EP_PORT_SMTP:-1025}:1025", "${EP_PORT_MAILPIT:-8025}:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    # Một lần: goose up qua DATABASE_URL trực tiếp (không qua PgBouncer — goose dùng khoá tư vấn session).
    build:
      context: ./backend-go
      target: gateway
    image: edupilot-gateway
    entrypoint: ["/gateway", "migrate"]
    command: ["up"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-}
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    # Không container_name và không công bố cổng: `--scale gateway=2` không tranh cổng (SRS 8.4).
    build:
      context: ./backend-go
      target: gateway
    image: edupilot-gateway
    environment:
      <<: *app-env
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      HTTP_ADDR: ${HTTP_ADDR:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-}
      SESSION_ABSOLUTE_TTL: ${SESSION_ABSOLUTE_TTL:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      BCRYPT_COST: ${BCRYPT_COST:-}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-}
      EXAM_TESTZIP_MAX_BYTES: ${EXAM_TESTZIP_MAX_BYTES:-}
      EXAM_TESTZIP_MAX_UNCOMPRESSED: ${EXAM_TESTZIP_MAX_UNCOMPRESSED:-}
      EXAM_MIN_DURATION_MINUTES: ${EXAM_MIN_DURATION_MINUTES:-}
      EXAM_MIN_LEAD_SECONDS: ${EXAM_MIN_LEAD_SECONDS:-}
      EXAM_GRACE_SECONDS: ${EXAM_GRACE_SECONDS:-}
      EXAM_SAVE_RATE_PER_MIN: ${EXAM_SAVE_RATE_PER_MIN:-}
      EXAM_TAB_STALE: ${EXAM_TAB_STALE:-}
      EXAM_RUN_LIMIT: ${EXAM_RUN_LIMIT:-}
      EXAM_RUN_WINDOW: ${EXAM_RUN_WINDOW:-}
      EXAM_SUBMIT_COOLDOWN: ${EXAM_SUBMIT_COOLDOWN:-}
      EXAM_SUBMISSION_CAP: ${EXAM_SUBMISSION_CAP:-}
      EXAM_EVENTS_MAX: ${EXAM_EVENTS_MAX:-}
      SIMILARITY_MIN: ${SIMILARITY_MIN:-}
      JUDGE_MAX_TOTAL_SECONDS: ${JUDGE_MAX_TOTAL_SECONDS:-}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-}
      RATE_LIMIT_IP_PER_MIN: ${RATE_LIMIT_IP_PER_MIN:-}
      RATE_LIMIT_USER_PER_MIN: ${RATE_LIMIT_USER_PER_MIN:-}
      # Giới hạn đăng nhập / đăng ký / liên kết theo IP: để trống = mặc định của gateway. `pnpm dev` nới 4 biến này (seed là MỘT IP gửi hàng nghìn
      # yêu cầu); docker-compose.test.yml KHÔNG đặt chúng nên stack thử giữ giới hạn thật (US-P2-12 AC9).
      AUTH_LOGIN_IP_PER_MIN: ${AUTH_LOGIN_IP_PER_MIN:-}
      AUTH_REGISTER_IP_PER_HOUR: ${AUTH_REGISTER_IP_PER_HOUR:-}
      AUTH_TOKEN_IP_PER_MIN: ${AUTH_TOKEN_IP_PER_MIN:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      SSE_HEARTBEAT: ${SSE_HEARTBEAT:-}
      SSE_MAX_DURATION: ${SSE_MAX_DURATION:-}
      SSE_MAX_PER_USER: ${SSE_MAX_PER_USER:-}
      SSE_CONN_TTL: ${SSE_CONN_TTL:-}
      SSE_BUFFER_MAXLEN: ${SSE_BUFFER_MAXLEN:-}
      SSE_BUFFER_TTL: ${SSE_BUFFER_TTL:-}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-}
      LLM_BATCH_SHARE: ${LLM_BATCH_SHARE:-}
      LLM_QUEUE_MAX: ${LLM_QUEUE_MAX:-}
      LLM_QUEUE_WAIT_MAX: ${LLM_QUEUE_WAIT_MAX:-}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-}
      LLM_BREAKER_FAILS: ${LLM_BREAKER_FAILS:-}
      LLM_BREAKER_OPEN: ${LLM_BREAKER_OPEN:-}
      LLM_DEFAULT_RPM: ${LLM_DEFAULT_RPM:-}
      LLM_DEFAULT_TPM: ${LLM_DEFAULT_TPM:-}
      LLM_EMBED_DIMS: ${LLM_EMBED_DIMS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_REPLAY_DIR: ${LLM_REPLAY_DIR:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FAKE_LLM_LATENCY: ${FAKE_LLM_LATENCY:-}
      FAKE_LLM_ERROR_RATE: ${FAKE_LLM_ERROR_RATE:-}
      FAKE_LLM_VALID_KEY: ${FAKE_LLM_VALID_KEY:-}
    read_only: true
    tmpfs: ["/tmp"]
    restart: on-failure:3
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/gateway", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ./backend-go
      target: worker
    image: edupilot-worker
    environment:
      <<: *app-env
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      WORKER_HEALTH_ADDR: ${WORKER_HEALTH_ADDR:-}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-}
      OUTBOX_BATCH: ${OUTBOX_BATCH:-}
      OUTBOX_RETRY_BACKOFF: ${OUTBOX_RETRY_BACKOFF:-}
      OUTBOX_CLAIM_IDLE: ${OUTBOX_CLAIM_IDLE:-}
      OUTBOX_STALE_AFTER: ${OUTBOX_STALE_AFTER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_TLS: ${SMTP_TLS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SEND_TIMEOUT: ${MAIL_SEND_TIMEOUT:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      VERIFY_TOKEN_TTL: ${VERIFY_TOKEN_TTL:-}
      RESET_TOKEN_TTL: ${RESET_TOKEN_TTL:-}
      INVITE_TOKEN_TTL: ${INVITE_TOKEN_TTL:-}
      # Máy chấm code (US-PE-02): đúng MỘT bản worker có JUDGE_CONSUMER=true.
      JUDGE_CONSUMER: ${JUDGE_CONSUMER:-true}
      JUDGE_URL: ${JUDGE_URL:-http://judge:5050}
      JUDGE_TOKEN: ${JUDGE_TOKEN:-}
      JUDGE_PARALLELISM: ${JUDGE_PARALLELISM:-}
      JUDGE_MEM_LIMIT: ${JUDGE_MEM_LIMIT:-2g}
      JUDGE_LEASE: ${JUDGE_LEASE:-}
      JUDGE_LEASE_RENEW: ${JUDGE_LEASE_RENEW:-}
      JUDGE_CLAIM_IDLE: ${JUDGE_CLAIM_IDLE:-}
      JUDGE_HTTP_SLACK: ${JUDGE_HTTP_SLACK:-}
      JUDGE_MAX_TOTAL_SECONDS: ${JUDGE_MAX_TOTAL_SECONDS:-}
      EXAM_TICK_INTERVAL: ${EXAM_TICK_INTERVAL:-}
      EXAM_GRACE_SECONDS: ${EXAM_GRACE_SECONDS:-}
    networks: [default, judge_net]
    read_only: true
    tmpfs: ["/tmp"]
    restart: on-failure:3
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      judge: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/worker", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Máy chấm code (go-judge, D58). Không `ports`, không volume, chỉ ở mạng nội bộ `judge_net` (không đường ra Internet / Postgres / Redis / MinIO).
  # `privileged` + `cgroup: host` là điều kiện của go-judge để dựng sandbox; container KHÔNG nhận bí mật nào ngoài JUDGE_*.
  # Colima arm64 (dev): đặt JUDGE_EXTRA_ARGS=-no-seccomp trong .env.local. KHÔNG đặt trên amd64.
  judge:
    build:
      context: ./deploy/judge
    image: edupilot-judge:dev
    environment:
      JUDGE_TOKEN: ${JUDGE_TOKEN:-}
      JUDGE_PARALLELISM: ${JUDGE_PARALLELISM:-2}
      JUDGE_EXTRA_ARGS: ${JUDGE_EXTRA_ARGS:-}
    privileged: true
    cgroup: host
    shm_size: 256m
    cpus: ${JUDGE_CPUS:-2}
    mem_limit: ${JUDGE_MEM_LIMIT:-2g}
    networks: [judge_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5050 && printf \"GET /version HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2.11
    ports: ["${EP_PORT_HTTP:-80}:80", "${EP_PORT_HTTPS:-443}:443"]
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost}
    ports: ["${EP_PORT_FRONTEND:-3000}:3000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  judge_net:
    internal: true
