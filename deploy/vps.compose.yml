# Chồng lên docker-compose.local.yml cho một máy chủ công khai (bộ VPS cũ, không còn dùng để đo từ 2026-11-12; sẽ là nền của docker-compose.prod ở P10 L4): `docker compose --env-file .env.local -f docker-compose.local.yml -f deploy/vps.compose.yml -p edupilot …`
# Chỉ Caddy mở cổng ra ngoài (80/443). Postgres, Redis, MinIO, mailpit, mock-* chỉ bind 127.0.0.1 (xem qua SSH tunnel). Không thêm service mới.
services:
  postgres:
    ports: !override ["127.0.0.1:${EP_PORT_POSTGRES:-5433}:5432"]
  redis:
    ports: !override ["127.0.0.1:${EP_PORT_REDIS:-6380}:6379"]
  minio:
    ports: !override ["127.0.0.1:${EP_PORT_MINIO:-9000}:9000", "127.0.0.1:${EP_PORT_MINIO_CONSOLE:-9001}:9001"]
  mailpit:
    # seed đọc liên kết xác minh từ Mailpit (127.0.0.1:8025); SMTP chỉ trong mạng compose
    ports: !override ["127.0.0.1:${EP_PORT_MAILPIT:-8025}:8025"]
  frontend:
    ports: !reset []
  caddy:
    environment:
      EP_HOST: ${EP_HOST}
      EP_CADDY_GLOBAL: ${EP_CADDY_GLOBAL:-}
    volumes: !override
      - ./deploy/caddy/Caddyfile.vps:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
