; PgBouncer của stack dev (SRS 8.3) — mount chỉ-đọc vào /etc/pgbouncer/pgbouncer.ini.
; KHÔNG chứa bí mật: mật khẩu nằm ở /etc/pgbouncer/userlist.txt, do entrypoint của
; edoburu/pgbouncer sinh lúc khởi động từ biến môi trường DATABASE_URLS (lấy từ .env.local).
; `stats_users` phải trùng PGBOUNCER_STATS_USER trong .env.local (tên tài khoản, không phải bí mật).

[databases]
; Chuyển tiếp mọi dbname tới Postgres; danh tính dùng chính tài khoản của client (userlist.txt).
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_file = /etc/pgbouncer/userlist.txt
auth_type = scram-sha-256
admin_users = edupilot
stats_users = pgb_stats

pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
query_wait_timeout = 30
server_lifetime = 1800
server_idle_timeout = 600
max_prepared_statements = 0
ignore_startup_parameters = extra_float_digits
