      summary: "Quyết định phúc khảo (chỉ TEACHER; Idempotency-Key bắt buộc): UPHELD giữ điểm, ADJUSTED sửa điểm tiêu chí tại chỗ trên kết quả đã công bố; phản hồi 10–2.000 ký tự bắt buộc (422 RESPONSE_REQUIRED); ADJUSTED cần ≥ 1 tiêu chí đổi (422 NO_CHANGE), điểm bước 0,25 ≤ max. Đóng ngay khi quyết; đã quyết 409 APPEAL_ALREADY_DECIDED; sai version 409 VERSION_CONFLICT. Sổ điểm LOCKED không chặn"
