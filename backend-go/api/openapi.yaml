      summary: "Gửi yêu cầu xem lại điểm bài tập (chỉ STUDENT của chính mình; Idempotency-Key bắt buộc; Cache-Control: no-store). Kết quả của sinh viên phải PUBLISHED (chưa → 404 ASSIGNMENT_NOT_FOUND), appeal_days > 0 (409 APPEAL_DISABLED), mỗi bài một lần (409 APPEAL_ALREADY_FILED), còn hạn published_at + appeal_days (409 APPEAL_WINDOW_CLOSED, details.closes_at), criteria_ids ⊆ rubric (422 CRITERION_UNKNOWN), lý do 10–1.000 ký tự (422 REASON_LENGTH). Không ghi escalation_tickets; không gọi LLM"
