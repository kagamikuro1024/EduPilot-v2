        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/courses/{id}/roster/import:
    post:
      operationId: importCourseRoster
      tags: [courses]
      summary: Nạp danh sách lớp từ CSV / XLSX (≤ 500 dòng, ≤ 2 MiB, theo magic bytes; không lưu tệp). Nối bằng email, KHÔNG bằng MSSV. `dry_run=true` không ghi gì. Chỉ giảng viên của lớp
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                send_invites:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Báo cáo nhập (hoặc xem trước khi dry_run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Tệp > 2 MiB (`PAYLOAD_TOO_LARGE`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/courses/{id}/share-sources:
    get:
      operationId: listShareSources
      tags: [courses]
      summary: Các lớp cùng học phần mà giảng viên cũng là TEACHER, chưa lưu trữ, kèm số tài liệu có thể dùng lại
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Nguồn đủ điều kiện (có thể rỗng)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareSources"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/share-from:
    post:
      operationId: shareCourseContent
      tags: [courses]
      summary: Dùng lại tài liệu của lớp nguồn (cùng học phần, giảng viên của cả hai); không nhúng lại, giữ audience; quy chế môn học không chia sẻ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareFromRequest"
      responses:
        "200":
          description: Số tài liệu dùng được ở lớp đích và phần bỏ qua
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/accept-invite:
    post:
      operationId: acceptInvite
      tags: [auth]
      summary: Người được mời tự đặt mật khẩu bằng liên kết một lần; trả như đăng nhập (phiên mới + cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          description: Đã đặt mật khẩu và đăng nhập. Refresh CHỈ nằm ở cookie `ep_rt`
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Đăng nhập bằng email + mật khẩu (công khai); phát access token trong thân và cookie refresh `ep_rt`
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Đã đăng nhập. Refresh token CHỈ nằm ở cookie `ep_rt` (HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth)
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Làm mới phiên bằng cookie `ep_rt` (xoay vòng; dùng lại token cũ thu hồi cả phiên). Cần Origin hợp lệ
      security: []
      responses:
        "200":
          description: Access token mới (cùng `sid`) và cookie `ep_rt` mới
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Đăng xuất thiết bị này (luôn 204, idempotent); xoá cookie `ep_rt`. Cần Origin hợp lệ
      security: []
      responses:
        "204":
          description: Đã đăng xuất (hoặc vốn không có phiên)
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/courses/{id}/llm-budget:
    get:
      operationId: getLLMCourseBudget
      tags: [llm]
      summary: Ngân sách theo lớp (chỉ ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ngân sách lớp
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMBudget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    put:
      operationId: putLLMCourseBudget
      tags: [llm]
      summary: Đặt ngân sách theo lớp (chỉ ADMIN); cần version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMBudgetInput"
      responses:
        "200":
          description: Ngân sách lớp mới
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMBudget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Chưa đăng nhập, token hết hạn / không hợp lệ / phiên bị thu hồi (`UNAUTHENTICATED`, `TOKEN_EXPIRED`, `TOKEN_INVALID`, `SESSION_REVOKED`, `INVALID_CREDENTIALS`)
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Sai vai trò, ngoài lớp hoặc Origin lạ (`FORBIDDEN`, `details.reason` = `role` | `course` | `origin`); tài khoản bị khoá (`ACCOUNT_DISABLED`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Không có route / tài nguyên / không có quyền biết (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Xung đột trạng thái hoặc phiên bản (`CONFLICT`, `VERSION_CONFLICT`, `IDEMPOTENCY_IN_PROGRESS`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Dữ liệu không hợp lệ (`VALIDATION_FAILED`, `INVALID_CURSOR`, `IDEMPOTENCY_KEY_*`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: Liên kết một lần không dùng được (`LINK_INVALID`, `details.reason` = `expired` | `used` | `invalid`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Quá hạn mức (`RATE_LIMITED`, `SSE_LIMIT_REACHED`); kèm `Retry-After`
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Phụ thuộc hỏng (`SERVICE_UNAVAILABLE`, `NOT_READY`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DeadlineExceeded:
      description: Quá thời hạn xử lý của request (`DEADLINE_EXCEEDED`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      required: [email, password, full_name]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
        full_name:
          type: string
        student_code:
          type: string
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
    ResendRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
    Message:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
    StatusResult:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      additionalProperties: false
      properties:
        token:
          type: string
        new_password:
          type: string
    TokenPreviewRequest:
      type: object
      required: [kind, token]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [RESET_PASSWORD, INVITE]
        token:
          type: string
    TokenPreview:
      type: object
      required: [valid, kind, expires_at]
      additionalProperties: false
      properties:
        valid:
          type: boolean
        kind:
          type: string
        expires_at:
          type: string
          format: date-time
        full_name:
          type: string
        role:
          type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
        new_password:
          type: string
    SessionItem:
      type: object
      required: [id, current, device_label, ip_masked, created_at, last_used_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
        device_label:
          type: string
        ip_masked:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    SessionList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/SessionItem"
    RevokedCount:
      type: object
      required: [revoked]
      additionalProperties: false
      properties:
        revoked:
          type: integer
    AcceptInviteRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
        password:
          type: string
    AdminUser:
      type: object
      required: [id, email, full_name, role, status, last_login_at, version]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [ADMIN, TEACHER, TA, STUDENT]
        status:
          type: string
          enum: [PENDING_VERIFICATION, INVITED, ACTIVE, DISABLED]
        last_login_at:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          minimum: 1
    CourseBrief:
      type: object
      required: [id, class_code, subject_code, name, semester, status]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        class_code:
          type: string
        subject_code:
          type: string
        name:
          type: string
        semester:
          type: string
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
    MyCourse:
      type: object
      required: [course, role_in_course, enrollment_status]
      additionalProperties: false
      properties:
        course:
          $ref: "#/components/schemas/CourseBrief"
        role_in_course:
          type: string
          enum: [TEACHER, TA, STUDENT]
        enrollment_status:
          type: string
          enum: [ACTIVE, PENDING]
    MyCoursePage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MyCourse"
        next_cursor:
          type: [string, "null"]
    CourseDetail:
      type: object
      required: [id, class_code, subject_code, name, semester, status, teachers, my_role]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        class_code:
          type: string
        subject_code:
          type: string
        name:
          type: string
        semester:
          type: string
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        teachers:
          type: array
          items:
            type: object
            required: [full_name]
            additionalProperties: false
            properties:
              full_name:
                type: string
        my_role:
          type: string
          enum: [ADMIN, TEACHER, TA, STUDENT]
        counts:
          type: object
          description: Chỉ GV / TA của lớp
          required: [students_active, students_pending]
          additionalProperties: false
          properties:
            students_active:
              type: integer
            students_pending:
              type: integer
    Profile:
      type: object
      required: [id, email, full_name, role, student_code, email_verified, version]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [ADMIN, TEACHER, TA, STUDENT]
        student_code:
          type: string
        email_verified:
          type: boolean
        version:
          type: integer
    ProfileInput:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        full_name:
          type: string
          maxLength: 100
        student_code:
          type: string
          description: 6–15 chữ và số, hoặc rỗng để xoá
        version:
          type: integer
          minimum: 1
    Settings:
      type: object
      required: [notify_ticket_by_mail, notify_answer_by_mail, remind_deadline_by_mail, version]
      additionalProperties: false
      properties:
        notify_ticket_by_mail:
          type: boolean
        notify_answer_by_mail:
          type: boolean
        remind_deadline_by_mail:
          type: boolean
        version:
          type: integer
    SettingsInput:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        notify_ticket_by_mail:
          type: boolean
        notify_answer_by_mail:
          type: boolean
        remind_deadline_by_mail:
          type: boolean
        version:
          type: integer
          minimum: 1
    PersonRef:
      type: object
      required: [id, full_name]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
    AdminCourse:
      type: object
      required: [id, class_code, subject_code, name, semester, status, teacher, assistants_count, students_active, students_pending, capacity, version]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        class_code:
          type: string
        subject_code:
          type: string
        name:
          type: string
        semester:
          type: string
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        teacher:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        assistants_count:
          type: integer
        students_active:
          type: integer
        students_pending:
          type: integer
        capacity:
          type: [integer, "null"]
        version:
          type: integer
    AdminCoursePage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminCourse"
        next_cursor:
          type: [string, "null"]
    CourseCreateInput:
      type: object
      required: [subject_code, class_code, name, semester]
      additionalProperties: false
      properties:
        subject_code:
          type: string
        class_code:
          type: string
          pattern: "^[A-Za-z0-9._-]{3,20}$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        semester:
          type: string
          pattern: "^[0-9]{4}-[0-9]{4}-HK[123]$"
        capacity:
          type: integer
          minimum: 1
          maximum: 1000
        teacher_id:
          type: string
          format: uuid
        ta_ids:
          type: array
          items:
            type: string
            format: uuid
        join_code:
          type: string
          description: Chỉ ngoài production (seed); ở production - 422
    CourseCreated:
      type: object
      required: [id, class_code, subject_code, name, semester, status, version, teacher]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        class_code:
          type: string
        subject_code:
          type: string
        name:
          type: string
        semester:
          type: string
        status:
          type: string
          enum: [ACTIVE]
        version:
          type: integer
        teacher:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
    CourseUpdateInput:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        subject_code:
          type: string
        class_code:
          type: string
        name:
          type: string
        semester:
          type: string
        capacity:
          type: [integer, "null"]
        version:
          type: integer
          minimum: 1
    CourseAssignInput:
      type: object
      additionalProperties: false
      properties:
        teacher_id:
          type: string
          format: uuid
        ta_ids:
          type: [array, "null"]
          items:
            type: string
            format: uuid
    AssistantsInput:
      type: object
      required: [ta_ids]
      additionalProperties: false
      properties:
        ta_ids:
          type: array
          items:
            type: string
            format: uuid
    CourseAssignResult:
      type: object
      required: [teacher, assistants, changed]
      additionalProperties: false
      properties:
        teacher:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        assistants:
          type: array
          items:
            $ref: "#/components/schemas/PersonRef"
        changed:
          type: object
          required: [teacher, added_ta, removed_ta]
          additionalProperties: false
          properties:
            teacher:
              type: boolean
            added_ta:
              type: array
              items:
                type: string
                format: uuid
            removed_ta:
              type: array
              items:
                type: string
                format: uuid
    AssistantCandidates:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 20
          items:
            type: object
            required: [id, full_name, email]
            additionalProperties: false
            properties:
              id:
                type: string
                format: uuid
              full_name:
                type: string
              email:
                type: string
    Notification:
      type: object
      required: [id, type, title, body, link, course_id, read_at, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        body:
          type: [string, "null"]
        link:
          type: [string, "null"]
          description: Luôn là đường dẫn nội bộ bắt đầu bằng /
        course_id:
          type: [string, "null"]
          format: uuid
        read_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    NotificationPage:
      type: object
      required: [items, next_cursor, unread_count]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Notification"
        next_cursor:
          type: [string, "null"]
        unread_count:
          type: integer
    JoinCodeInput:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 64
    JoinPreview:
      type: object
