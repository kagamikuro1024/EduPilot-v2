      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Một trang lớp (kèm ETag; 304 khi If-None-Match khớp)
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCoursePage"
        "304":
          description: Không đổi
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Chi tiết lớp cho thành viên ACTIVE hoặc Admin (SV không thấy mã tham gia / thành viên; GV, TA thêm số đếm sinh viên)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chi tiết lớp
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/me/profile:
    get:
      operationId: getMyProfile
      tags: [me]
      summary: Hồ sơ của chính mình (email, vai trò chỉ đọc)
      responses:
        "200":
          description: Hồ sơ
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "304":
          description: Không đổi
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putMyProfile
      tags: [me]
      summary: Sửa tên và mã số sinh viên khai báo (khoá lạc quan theo version; không đổi ảnh chụp MSSV ở lớp, không nối tài khoản vào lớp)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Hồ sơ sau khi đổi
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/me/settings:
    get:
      operationId: getMySettings
      tags: [me]
      summary: Tuỳ chọn thông báo qua thư của chính mình (tạo lười lần đầu)
      responses:
        "200":
          description: Tuỳ chọn
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "304":
          description: Không đổi
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putMySettings
      tags: [me]
      summary: Sửa tuỳ chọn (khoá lạc quan theo version; khoá lạ - 422)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Tuỳ chọn sau khi đổi
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/accept-invite:
    post:
      operationId: acceptInvite
      tags: [auth]
      summary: Người được mời tự đặt mật khẩu bằng liên kết một lần; trả như đăng nhập (phiên mới + cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          description: Đã đặt mật khẩu và đăng nhập. Refresh CHỈ nằm ở cookie `ep_rt`
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Đăng nhập bằng email + mật khẩu (công khai); phát access token trong thân và cookie refresh `ep_rt`
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Đã đăng nhập. Refresh token CHỈ nằm ở cookie `ep_rt` (HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth)
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Làm mới phiên bằng cookie `ep_rt` (xoay vòng; dùng lại token cũ thu hồi cả phiên). Cần Origin hợp lệ
      security: []
      responses:
        "200":
          description: Access token mới (cùng `sid`) và cookie `ep_rt` mới
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Đăng xuất thiết bị này (luôn 204, idempotent); xoá cookie `ep_rt`. Cần Origin hợp lệ
      security: []
      responses:
        "204":
          description: Đã đăng xuất (hoặc vốn không có phiên)
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/courses/{id}/llm-budget:
    get:
      operationId: getLLMCourseBudget
      tags: [llm]
      summary: Ngân sách theo lớp (chỉ ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ngân sách lớp
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMBudget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    put:
      operationId: putLLMCourseBudget
      tags: [llm]
      summary: Đặt ngân sách theo lớp (chỉ ADMIN); cần version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMBudgetInput"
      responses:
        "200":
          description: Ngân sách lớp mới
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMBudget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Chưa đăng nhập, token hết hạn / không hợp lệ / phiên bị thu hồi (`UNAUTHENTICATED`, `TOKEN_EXPIRED`, `TOKEN_INVALID`, `SESSION_REVOKED`, `INVALID_CREDENTIALS`)
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Sai vai trò, ngoài lớp hoặc Origin lạ (`FORBIDDEN`, `details.reason` = `role` | `course` | `origin`); tài khoản bị khoá (`ACCOUNT_DISABLED`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Không có route / tài nguyên / không có quyền biết (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Xung đột trạng thái hoặc phiên bản (`CONFLICT`, `VERSION_CONFLICT`, `IDEMPOTENCY_IN_PROGRESS`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Dữ liệu không hợp lệ (`VALIDATION_FAILED`, `INVALID_CURSOR`, `IDEMPOTENCY_KEY_*`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: Liên kết một lần không dùng được (`LINK_INVALID`, `details.reason` = `expired` | `used` | `invalid`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Quá hạn mức (`RATE_LIMITED`, `SSE_LIMIT_REACHED`); kèm `Retry-After`
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Phụ thuộc hỏng (`SERVICE_UNAVAILABLE`, `NOT_READY`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DeadlineExceeded:
      description: Quá thời hạn xử lý của request (`DEADLINE_EXCEEDED`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      required: [email, password, full_name]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
        full_name:
          type: string
        student_code:
          type: string
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
    ResendRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
    Message:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
    StatusResult:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      additionalProperties: false
      properties:
        token:
          type: string
        new_password:
          type: string
    TokenPreviewRequest:
      type: object
      required: [kind, token]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [RESET_PASSWORD, INVITE]
        token:
          type: string
    TokenPreview:
      type: object
      required: [valid, kind, expires_at]
      additionalProperties: false
      properties:
        valid:
          type: boolean
        kind:
          type: string
        expires_at:
          type: string
          format: date-time
        full_name:
          type: string
        role:
          type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
        new_password:
          type: string
    SessionItem:
      type: object
      required: [id, current, device_label, ip_masked, created_at, last_used_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
        device_label:
          type: string
        ip_masked:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    SessionList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/SessionItem"
    RevokedCount:
      type: object
      required: [revoked]
      additionalProperties: false
      properties:
        revoked:
          type: integer
    AcceptInviteRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
        password:
          type: string
    AdminUser:
      type: object
      required: [id, email, full_name, role, status, last_login_at, version]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [ADMIN, TEACHER, TA, STUDENT]
        status:
          type: string
          enum: [PENDING_VERIFICATION, INVITED, ACTIVE, DISABLED]
        last_login_at:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          minimum: 1
    CourseBrief:
      type: object
      required: [id, class_code, subject_code, name, semester, status]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        class_code:
          type: string
        subject_code:
          type: string
        name:
          type: string
        semester:
          type: string
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
    MyCourse:
      type: object
      required: [course, role_in_course, enrollment_status]
      additionalProperties: false
      properties:
        course:
          $ref: "#/components/schemas/CourseBrief"
        role_in_course:
          type: string
          enum: [TEACHER, TA, STUDENT]
        enrollment_status:
          type: string
          enum: [ACTIVE, PENDING]
    MyCoursePage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MyCourse"
        next_cursor:
          type: [string, "null"]
    CourseDetail:
      type: object
      required: [id, class_code, subject_code, name, semester, status, teachers, my_role]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        class_code:
          type: string
        subject_code:
          type: string
        name:
          type: string
        semester:
          type: string
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        teachers:
          type: array
          items:
            type: object
            required: [full_name]
            additionalProperties: false
            properties:
              full_name:
                type: string
        my_role:
          type: string
          enum: [ADMIN, TEACHER, TA, STUDENT]
        counts:
          type: object
          description: Chỉ GV / TA của lớp
          required: [students_active, students_pending]
          additionalProperties: false
          properties:
            students_active:
              type: integer
            students_pending:
              type: integer
    Profile:
      type: object
      required: [id, email, full_name, role, student_code, email_verified, version]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [ADMIN, TEACHER, TA, STUDENT]
        student_code:
          type: string
        email_verified:
          type: boolean
        version:
          type: integer
    ProfileInput:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        full_name:
          type: string
          maxLength: 100
        student_code:
          type: string
          description: 6–15 chữ và số, hoặc rỗng để xoá
        version:
          type: integer
          minimum: 1
    Settings:
      type: object
      required: [notify_ticket_by_mail, notify_answer_by_mail, remind_deadline_by_mail, version]
      additionalProperties: false
      properties:
        notify_ticket_by_mail:
          type: boolean
        notify_answer_by_mail:
          type: boolean
        remind_deadline_by_mail:
          type: boolean
        version:
          type: integer
    SettingsInput:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        notify_ticket_by_mail:
          type: boolean
        notify_answer_by_mail:
          type: boolean
        remind_deadline_by_mail:
          type: boolean
        version:
          type: integer
          minimum: 1
    AdminUserPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminUser"
        next_cursor:
          type: [string, "null"]
    AdminInviteInput:
      type: object
      required: [email, full_name, role]
      additionalProperties: false
      properties:
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [TEACHER, TA]
    AdminUserPatch:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
        full_name:
          type: string
        role:
          type: string
          enum: [TEACHER, TA]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    AdminInviteResent:
      type: object
      required: [expires_at]
      additionalProperties: false
      properties:
        expires_at:
          type: string
          format: date-time
    AuthUser:
      type: object
      required: [id, email, full_name, role, status, email_verified]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [ADMIN, TEACHER, TA, STUDENT]
        status:
          type: string
          enum: [PENDING_VERIFICATION, INVITED, ACTIVE, DISABLED]
        email_verified:
          type: boolean
    SessionResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      additionalProperties: false
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
        user:
          $ref: "#/components/schemas/AuthUser"
    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
    Ready:
      type: object
      required: [status, db, redis]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ready]
        db:
          type: string
          enum: [up]
        redis:
          type: string
          enum: [up]
    Job:
      type: object
      required: [id, kind, status, progress, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        result: {}
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    LLMModel:
      type: object
      required: [id, model, kind, dims, price_in, price_out, enabled]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        model:
          type: string
        kind:
          type: string
          enum: [chat, embedding]
        dims:
          type: [integer, "null"]
        price_in:
          type: string
          pattern: "^[0-9]+\\.[0-9]{4}$"
        price_out:
          type: string
          pattern: "^[0-9]+\\.[0-9]{4}$"
        enabled:
          type: boolean
    LLMLastTest:
      type: object
      required: [ok, at, error_kind]
      additionalProperties: false
      properties:
        ok:
          type: [boolean, "null"]
        at:
          type: [string, "null"]
          format: date-time
        error_kind:
          type: [string, "null"]
    LLMProvider:
      type: object
      required: [id, type, name, base_url, enabled, has_key, key_status, rpm_limit, tpm_limit, last_test, circuit, models, version]
      additionalProperties: false
      description: Không có trường khoá, đuôi khoá hay api_key trong bất kỳ phản hồi nào.
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [openai, anthropic, gemini, openai_compatible, fake]
        name:
          type: string
        base_url:
          type: [string, "null"]
        enabled:
          type: boolean
        has_key:
          type: boolean
        key_status:
          type: string
          enum: [ok, missing, unreadable]
        rpm_limit:
          type: [integer, "null"]
        tpm_limit:
          type: [integer, "null"]
        last_test:
          $ref: "#/components/schemas/LLMLastTest"
        circuit:
          type: string
          enum: [closed, open, half_open]
        models:
          type: array
          items:
            $ref: "#/components/schemas/LLMModel"
        version:
          type: integer
          minimum: 1
    LLMProviderList:
      type: object
      required: [items, env_fallback]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/LLMProvider"
        env_fallback:
          type: object
          required: [active, providers]
          additionalProperties: false
          properties:
            active:
              type: boolean
            providers:
              type: array
              items:
                type: string
    LLMModelInput:
      type: object
      required: [model, kind, price_in, price_out]
      additionalProperties: false
      properties:
        model:
          type: string
        kind:
          type: string
          enum: [chat, embedding]
        dims:
          type: integer
        price_in:
          type: string
        price_out:
          type: string
        enabled:
          type: boolean
    LLMProviderInput:
      type: object
      required: [type, name]
      additionalProperties: false
      description: |
        PUT không gửi api_key = giữ khoá; chuỗi rỗng → 422. `models` thay thế toàn bộ danh sách (không gửi = giữ).
        `skip_verify` chỉ ADMIN, ghi audit_log. PUT cần version (thân hoặc If-Match W/"v<n>").
      properties:
        type:
          type: string
          enum: [openai, anthropic, gemini, openai_compatible, fake]
        name:
          type: string
        base_url:
          type: string
        api_key:
          type: string
          writeOnly: true
        enabled:
          type: boolean
        rpm_limit:
          type: integer
        tpm_limit:
          type: integer
        models:
          type: array
          items:
            $ref: "#/components/schemas/LLMModelInput"
        skip_verify:
          type: boolean
        version:
          type: integer
    LLMCandidateInput:
      type: object
      required: [type, model]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [openai, anthropic, gemini, openai_compatible, fake]
        base_url:
          type: string
        api_key:
          type: string
          writeOnly: true
        model:
          type: string
        kind:
          type: string
          enum: [chat, embedding]
    LLMTestOverride:
      type: object
      additionalProperties: false
      properties:
        api_key:
          type: string
          writeOnly: true
        base_url:
          type: string
        model:
          type: string
    LLMTestResult:
      type: object
      required: [ok, latency_ms]
      additionalProperties: false
      properties:
        ok:
          type: boolean
        error_kind:
          type: string
          enum: [AUTH, NETWORK, TIMEOUT, RATE_LIMIT, MODEL_NOT_FOUND, BAD_RESPONSE, DIMS_MISMATCH]
        message:
          type: string
        latency_ms:
          type: integer
          minimum: 0
    LLMRoute:
      type: object
      required: [task, lane, chain, params, version]
      additionalProperties: false
      properties:
        task:
          type: string
          enum: [CHAT, CLASSIFY, UTILITY, GRADING, QUESTION_GEN, INSIGHT, EMBEDDING]
        lane:
          type: string
          enum: [INTERACTIVE, NEAR_REALTIME, BATCH]
        chain:
          type: array
          items:
            type: object
            required: [model_id, provider_id, provider_name, model]
            additionalProperties: false
            properties:
              model_id:
                type: string
                format: uuid
              provider_id:
                type: string
                format: uuid
              provider_name:
                type: string
              model:
                type: string
        params:
          type: object
          additionalProperties:
            type: number
        version:
          type: integer
          minimum: 0
    LLMRoutePut:
      type: object
      required: [task, lane, chain, params, version, reindex_required]
      additionalProperties: false
      properties:
        task:
          type: string
          enum: [CHAT, CLASSIFY, UTILITY, GRADING, QUESTION_GEN, INSIGHT, EMBEDDING]
        lane:
          type: string
          enum: [INTERACTIVE, NEAR_REALTIME, BATCH]
        chain:
          type: array
          items:
            type: object
            required: [model_id, provider_id, provider_name, model]
            additionalProperties: false
            properties:
              model_id:
                type: string
                format: uuid
              provider_id:
                type: string
                format: uuid
              provider_name:
                type: string
              model:
                type: string
        params:
          type: object
          additionalProperties:
            type: number
        version:
          type: integer
          minimum: 0
        reindex_required:
          type: boolean
    LLMRoutes:
      type: object
      required: [items, embedding]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/LLMRoute"
        embedding:
          type: [object, "null"]
          required: [model_id, provider_name, model, dims, reindex_required, indexed_chunks]
          additionalProperties: false
          properties:
            model_id:
              type: string
              format: uuid
            provider_name:
              type: string
            model:
              type: string
            dims:
              type: integer
            reindex_required:
              type: boolean
            indexed_chunks:
              type: [integer, "null"]
    LLMRouteInput:
      type: object
      required: [task, chain, version]
      additionalProperties: false
      properties:
        task:
          type: string
        chain:
          type: array
          items:
            type: string
            format: uuid
        params:
          type: object
          additionalProperties:
            type: number
        version:
          type: integer
          minimum: 0
    LLMUsage:
      type: object
      required: [from, to, group, items]
      additionalProperties: false
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        group:
          type: string
          enum: [task, day]
        items:
          type: array
          items:
            type: object
            required: [key, calls, tokens_in, tokens_out, cost_est, latency_p50_ms, latency_p95_ms, errors, degraded]
            additionalProperties: false
            properties:
              key:
                type: string
              calls:
                type: integer
              tokens_in:
                type: integer
              tokens_out:
                type: integer
              cost_est:
                type: string
              latency_p50_ms:
                type: integer
              latency_p95_ms:
                type: integer
              errors:
                type: integer
              degraded:
                type: integer
    LLMBudget:
      type: object
      required: [scope, daily_limit, monthly_limit, spent_today, spent_month, pct_today, pct_month, state, version]
      additionalProperties: false
      description: Tiền là chuỗi thập phân VND; pct_* chỉ để hiển thị (null khi không có hạn mức).
      properties:
        scope:
          type: string
          enum: [system, course]
        course_id:
          type: string
          format: uuid
        daily_limit:
          type: [string, "null"]
        monthly_limit:
          type: [string, "null"]
        spent_today:
          type: string
        spent_month:
          type: string
        pct_today:
          type: [number, "null"]
        pct_month:
          type: [number, "null"]
        state:
          type: string
          enum: [ok, warn, exhausted]
        version:
          type: integer
          minimum: 0
    LLMBudgetInput:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        daily_limit:
          type: [string, number, "null"]
        monthly_limit:
          type: [string, number, "null"]
        version:
          type: integer
          minimum: 0
    Error:
      type: object
      required: [code, message, trace_id]
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - UNAUTHENTICATED
            - TOKEN_EXPIRED
            - TOKEN_INVALID
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - CONFLICT
            - VERSION_CONFLICT
            - IDEMPOTENCY_IN_PROGRESS
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - VALIDATION_FAILED
            - INVALID_CURSOR
            - IDEMPOTENCY_KEY_REUSED
            - IDEMPOTENCY_KEY_REQUIRED
            - RATE_LIMITED
            - SSE_LIMIT_REACHED
            - INTERNAL
            - SERVICE_UNAVAILABLE
            - NOT_READY
            - DEADLINE_EXCEEDED
            - OVERLOADED
            - LLM_NOT_CONFIGURED
            - LLM_UNAVAILABLE
            - PROVIDER_IN_USE
            - MODEL_DIMS_MISMATCH
            - ROUTE_INVALID
            - INVALID_CREDENTIALS
            - LOGIN_THROTTLED
            - ACCOUNT_DISABLED
            - SESSION_REVOKED
            - LINK_INVALID
            - EMAIL_NOT_VERIFIED
        message:
          type: string
        trace_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        details: {}
        retry_after:
          type: integer
          minimum: 1
