openapi: 3.1.0
info:
  title: EduPilot Gateway API
  version: 0.14.0
  description: |
    Hợp đồng API của gateway Go — NGUỒN SỰ THẬT (D45). Mỗi route trong mã phải có ở đây và ngược lại
    (`internal/contract` kiểm hai chiều). Route thử nằm ở `openapi.test.yaml`, chỉ có trong binary dựng bằng
    build tag `testroutes`. Phase PG chưa có endpoint nghiệp vụ; P1 (FEAT-llm-gateway US-P1-04) thêm 13 thao tác `/admin/llm/*` và `/courses/{id}/llm-budget`.
    P2 (FEAT-account-security US-P2-02) thêm 9 thao tác `/auth/{login,refresh,logout,register,verify-email,resend-verification,forgot-password,reset-password,tokens/preview}` và 4 thao tác `/me/{password,sessions,sessions/{id}}` (US-P2-04); US-P2-05 thêm 429 (`LOGIN_THROTTLED` | `RATE_LIMITED`) cho login / register / verify-email / reset-password / refresh: công khai (không Bearer); `refresh`/`logout` dùng cookie `ep_rt` (HttpOnly) + kiểm Origin.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: health
  - name: jobs
  - name: events
  - name: llm
  - name: auth
  - name: today
  - name: exam
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Kiểm sống (công khai, không gọi DB/Redis)
      security: []
      responses:
        "200":
          description: Gateway đang chạy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/healthz:
    get:
      operationId: getApiHealthz
      tags: [health]
      summary: Kiểm sống dưới /api/v1 (công khai)
      security: []
      responses:
        "200":
          description: Gateway đang chạy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Kiểm sẵn sàng — Postgres và Redis (công khai)
      security: []
      responses:
        "200":
          description: DB và Redis đều lên
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Trạng thái một việc dài (chủ job hoặc ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Trạng thái và tiến độ của job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Luồng sự kiện thời gian thực (SSE) của chính người gọi
      description: |
        `text/event-stream`. Xác thực bằng header `Authorization` (không nhận token qua query). Khung sự kiện
        `id/event/data`; heartbeat `: hb` mỗi 25 s; tối đa 2 kết nối mỗi người; tự đóng sau 120 s bằng
        `event: reconnect`. Nối lại bằng header `Last-Event-ID`.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Luồng SSE đang mở
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/admin/llm/providers:
    get:
      operationId: listLLMProviders
      tags: [llm]
      summary: Danh sách nhà cung cấp LLM (ADMIN, TEACHER; trần 20 nhà, không phân trang)
      responses:
        "200":
          description: Nhà cung cấp + env dự phòng
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMProviderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createLLMProvider
      tags: [llm]
      summary: Tạo nhà cung cấp (ADMIN); kiểm tra kết nối trước khi lưu, khoá sai → 422 và không lưu
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMProviderInput"
      responses:
        "201":
          description: Đã tạo
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/llm/providers/test:
    post:
      operationId: testLLMCandidate
      tags: [llm]
      summary: Thử khoá ứng viên chưa lưu (ADMIN; 10 lần/phút/người)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMCandidateInput"
      responses:
        "200":
          description: Kết quả Test (ok hoặc error_kind)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/admin/llm/providers/{id}:
    put:
      operationId: updateLLMProvider
      tags: [llm]
      summary: Sửa nhà cung cấp (ADMIN); cần version; kiểm tra kết nối nếu đổi api_key / base_url
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMProviderInput"
      responses:
        "200":
          description: Đã sửa
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteLLMProvider
      tags: [llm]
      summary: Xoá nhà cung cấp (ADMIN); đang được tuyến dùng → 409 PROVIDER_IN_USE
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Đã xoá
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/llm/providers/{id}/test:
    post:
      operationId: testLLMProvider
      tags: [llm]
      summary: Thử bản ghi đã lưu (ADMIN); thân tuỳ chọn ghi đè api_key / base_url / model, không lưu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMTestOverride"
      responses:
        "200":
          description: Kết quả Test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/admin/llm/routes:
    get:
      operationId: listLLMRoutes
      tags: [llm]
      summary: Tuyến của 7 tác vụ + khối embedding (ADMIN, TEACHER)
      responses:
        "200":
          description: Tuyến
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMRoutes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putLLMRoute
      tags: [llm]
      summary: Đặt chuỗi mô hình của MỘT tác vụ (ADMIN); hoán đổi nguyên tử và nạp lại nóng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMRouteInput"
      responses:
        "200":
          description: Tuyến mới
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMRoutePut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/llm/usage:
    get:
      operationId: getLLMUsage
      tags: [llm]
      summary: Mức dùng gom theo tác vụ hoặc ngày (ADMIN, TEACHER); mặc định 7 ngày, tối đa 92
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: group
          in: query
          required: false
          schema:
            type: string
        - name: course_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Mức dùng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/llm/budget:
    get:
      operationId: getLLMBudget
      tags: [llm]
      summary: Ngân sách hệ thống (ADMIN, TEACHER)
      responses:
        "200":
          description: Ngân sách
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMBudget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putLLMBudget
      tags: [llm]
      summary: Đặt ngân sách hệ thống (ADMIN); cần version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMBudgetInput"
      responses:
        "200":
          description: Ngân sách mới
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMBudget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Sinh viên tự đăng ký (công khai; CHỈ tạo STUDENT chờ xác minh). Mọi kết quả hợp lệ trả cùng một thân (chống dò email)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Đã nhận (không cho biết email có sẵn hay không)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "413":
          $ref: "#/components/responses/ValidationFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Xác minh email bằng liên kết một lần (công khai); 410 LINK_INVALID kèm details.reason expired|used|invalid
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Email đã được xác minh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Gửi lại thư xác minh (công khai kèm email, hoặc đã đăng nhập không kèm thân); 1 lần / 60 giây theo băm email
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendRequest"
      responses:
        "202":
          description: Đã nhận (không cho biết email có cần xác minh hay không)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Quên mật khẩu (công khai); mọi email trả cùng một thân (chống dò). 3 lần / giờ / băm email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendRequest"
      responses:
        "202":
          description: Đã nhận (không cho biết email có tài khoản hay không)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Đặt lại mật khẩu bằng liên kết một lần; thu hồi mọi phiên, không tự đăng nhập
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Mật khẩu đã đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/tokens/preview:
    post:
      operationId: previewToken
      tags: [auth]
      summary: Xem trước liên kết RESET_PASSWORD | INVITE mà KHÔNG tiêu token (không trả email)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenPreviewRequest"
      responses:
        "200":
          description: Liên kết dùng được
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPreview"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Danh sách người dùng cho Admin (con trỏ; dữ liệu tối thiểu; chỉ ADMIN kể cả GET)
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [ADMIN, TEACHER, TA, STUDENT]
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_VERIFICATION, INVITED, ACTIVE, DISABLED]
        - name: q
          in: query
          description: Tên (chứa, không phân biệt dấu) hoặc tiền tố email
          schema:
            type: string
            maxLength: 100
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Một trang người dùng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: inviteAdminUser
      tags: [admin]
      summary: Mời giảng viên / trợ giảng bằng liên kết gửi qua thư (người được mời tự đặt mật khẩu; Admin không thấy, không đặt)
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInviteInput"
      responses:
        "201":
          description: Đã tạo lời mời
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/users/{id}:
    patch:
      operationId: patchAdminUser
      tags: [admin]
      summary: Khoá / mở khoá, đổi vai giữa TEACHER và TA, đổi tên (khoá lạc quan theo version); khoá hoặc đổi vai thu hồi mọi phiên
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserPatch"
      responses:
        "200":
          description: Bản ghi sau khi đổi
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/users/{id}/resend-invite:
    post:
      operationId: resendAdminInvite
      tags: [admin]
      summary: Gửi lại lời mời (chỉ tài khoản INVITED; liên kết cũ chết ngay; 1 lần / 60 giây)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lời mời mới đã xếp để gửi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInviteResent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/me/password:
    post:
      operationId: changePassword
      tags: [me]
      summary: Đổi mật khẩu của chính mình; thu hồi mọi phiên khác. 5 lần sai / 10 phút
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Đã đổi
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/me/sessions:
    get:
      operationId: listMySessions
      tags: [me]
      summary: Thiết bị đang đăng nhập của chính mình (≤ 50; phiên hiện tại đứng đầu; IP đã che)
      responses:
        "200":
          description: Danh sách phiên
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: revokeOtherSessions
      tags: [me]
      summary: Đăng xuất mọi thiết bị khác (giữ phiên hiện tại)
      responses:
        "200":
          description: Số phiên đã thu hồi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedCount"
        "401":
