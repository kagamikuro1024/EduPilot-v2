components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Chưa đăng nhập, token hết hạn / không hợp lệ / phiên bị thu hồi (`UNAUTHENTICATED`, `TOKEN_EXPIRED`, `TOKEN_INVALID`, `SESSION_REVOKED`, `INVALID_CREDENTIALS`)
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Sai vai trò, ngoài lớp hoặc Origin lạ (`FORBIDDEN`, `details.reason` = `role` | `course` | `origin`); tài khoản bị khoá (`ACCOUNT_DISABLED`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Không có route / tài nguyên / không có quyền biết (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Xung đột trạng thái hoặc phiên bản (`CONFLICT`, `VERSION_CONFLICT`, `IDEMPOTENCY_IN_PROGRESS`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Dữ liệu không hợp lệ (`VALIDATION_FAILED`, `INVALID_CURSOR`, `IDEMPOTENCY_KEY_*`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: Liên kết một lần không dùng được (`LINK_INVALID`, `details.reason` = `expired` | `used` | `invalid`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Quá hạn mức (`RATE_LIMITED`, `SSE_LIMIT_REACHED`); kèm `Retry-After`
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Phụ thuộc hỏng (`SERVICE_UNAVAILABLE`, `NOT_READY`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DeadlineExceeded:
      description: Quá thời hạn xử lý của request (`DEADLINE_EXCEEDED`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    StudentUid:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ObservationId:
      name: oid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: docId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChunkId:
      name: chunkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      required: [email, password, full_name]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
        full_name:
          type: string
        student_code:
          type: string
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
    ResendRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
    Message:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
    StatusResult:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      additionalProperties: false
      properties:
        token:
          type: string
        new_password:
          type: string
    TokenPreviewRequest:
      type: object
      required: [kind, token]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [RESET_PASSWORD, INVITE]
        token:
          type: string
    TokenPreview:
      type: object
      required: [valid, kind, expires_at]
      additionalProperties: false
      properties:
        valid:
          type: boolean
        kind:
          type: string
        expires_at:
          type: string
          format: date-time
        full_name:
          type: string
        role:
          type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
        new_password:
          type: string
    SessionItem:
      type: object
      required: [id, current, device_label, ip_masked, created_at, last_used_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
        device_label:
          type: string
        ip_masked:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    SessionList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/SessionItem"
    RevokedCount:
      type: object
      required: [revoked]
      additionalProperties: false
      properties:
        revoked:
          type: integer
    AcceptInviteRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
        password:
          type: string
    AdminUser:
      type: object
      required: [id, email, full_name, role, status, last_login_at, version]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [ADMIN, TEACHER, TA, STUDENT]
        status:
          type: string
          enum: [PENDING_VERIFICATION, INVITED, ACTIVE, DISABLED]
        last_login_at:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          minimum: 1
    CourseBrief:
      type: object
      required: [id, class_code, subject_code, name, semester, status]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        class_code:
          type: string
        subject_code:
          type: string
        name:
          type: string
        semester:
          type: string
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
    MyCourse:
      type: object
      required: [course, role_in_course, enrollment_status]
      additionalProperties: false
      properties:
        course:
          $ref: "#/components/schemas/CourseBrief"
