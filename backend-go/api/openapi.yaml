        key_status:
          type: string
          enum: [ok, missing, unreadable]
        rpm_limit:
          type: [integer, "null"]
        tpm_limit:
          type: [integer, "null"]
        last_test:
          $ref: "#/components/schemas/LLMLastTest"
        circuit:
          type: string
          enum: [closed, open, half_open]
        models:
          type: array
          items:
            $ref: "#/components/schemas/LLMModel"
        version:
          type: integer
          minimum: 1
