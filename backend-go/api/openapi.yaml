          enum: [chat, embedding]
        dims:
          type: integer
        price_in:
          type: string
        price_out:
          type: string
        enabled:
          type: boolean
    LLMProviderInput:
      type: object
      required: [type, name]
      additionalProperties: false
      description: |
        PUT không gửi api_key = giữ khoá; chuỗi rỗng → 422. `models` thay thế toàn bộ danh sách (không gửi = giữ).
        `skip_verify` chỉ ADMIN, ghi audit_log. PUT cần version (thân hoặc If-Match W/"v<n>").
      properties:
        type:
          type: string
          enum: [openai, anthropic, gemini, openai_compatible, fake]
        name:
          type: string
        base_url:
          type: string
        api_key:
          type: string
          writeOnly: true
        enabled:
          type: boolean
        rpm_limit:
          type: integer
        tpm_limit:
          type: integer
        models:
          type: array
          items:
            $ref: "#/components/schemas/LLMModelInput"
        skip_verify:
          type: boolean
        version:
          type: integer
    LLMCandidateInput:
      type: object
      required: [type, model]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [openai, anthropic, gemini, openai_compatible, fake]
        base_url:
          type: string
        api_key:
          type: string
          writeOnly: true
        model:
          type: string
        kind:
          type: string
          enum: [chat, embedding]
