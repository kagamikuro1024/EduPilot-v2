            - SSE_LIMIT_REACHED
            - INTERNAL
            - SERVICE_UNAVAILABLE
            - NOT_READY
            - DEADLINE_EXCEEDED
            - OVERLOADED
            - LLM_NOT_CONFIGURED
            - LLM_UNAVAILABLE
            - PROVIDER_IN_USE
            - MODEL_DIMS_MISMATCH
            - ROUTE_INVALID
            - INVALID_CREDENTIALS
