    post:
      operationId: escalateChatMessage
      tags: [chat]
      summary: "Nhờ giảng viên (chỉ sinh viên chủ phiên; idempotent theo message_id — gọi lại trả 200 already:true; không mở lại ticket đã đóng)"
      description: |
        Tin phải là câu trả lời DONE của AI, phiên chưa xoá, intent không phải CRISIS / OTHER_PERSON / SMALLTALK (→ 422 MESSAGE_NOT_ESCALATABLE).
