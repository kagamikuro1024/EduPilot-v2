          type: integer
          minimum: 1
    Settings:
      type: object
      required: [notify_ticket_by_mail, notify_answer_by_mail, remind_deadline_by_mail, version]
      additionalProperties: false
      properties:
        notify_ticket_by_mail:
          type: boolean
        notify_answer_by_mail:
          type: boolean
        remind_deadline_by_mail:
          type: boolean
        version:
          type: integer
    SettingsInput:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        notify_ticket_by_mail:
          type: boolean
        notify_answer_by_mail:
          type: boolean
        remind_deadline_by_mail:
          type: boolean
        version:
          type: integer
          minimum: 1
    PersonRef:
      type: object
      required: [id, full_name]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
    AdminCourse:
      type: object
      required: [id, class_code, subject_code, name, semester, status, teacher, assistants_count, students_active, students_pending, capacity, version]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        class_code:
          type: string
        subject_code:
          type: string
        name:
          type: string
        semester:
          type: string
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        teacher:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        assistants_count:
          type: integer
        students_active:
          type: integer
        students_pending:
          type: integer
        capacity:
          type: [integer, "null"]
        version:
          type: integer
    AdminCoursePage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminCourse"
        next_cursor:
          type: [string, "null"]
    CourseCreateInput:
      type: object
      required: [subject_code, class_code, name, semester]
      additionalProperties: false
      properties:
        subject_code:
          type: string
        class_code:
          type: string
          pattern: "^[A-Za-z0-9._-]{3,20}$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        semester:
          type: string
          pattern: "^[0-9]{4}-[0-9]{4}-HK[123]$"
        capacity:
          type: integer
          minimum: 1
          maximum: 1000
        teacher_id:
          type: string
          format: uuid
        ta_ids:
          type: array
          items:
            type: string
            format: uuid
        join_code:
          type: string
          description: Chỉ ngoài production (seed); ở production - 422
    CourseCreated:
      type: object
      required: [id, class_code, subject_code, name, semester, status, version, teacher]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        class_code:
          type: string
        subject_code:
          type: string
        name:
          type: string
        semester:
          type: string
        status:
          type: string
          enum: [ACTIVE]
        version:
          type: integer
        teacher:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
    CourseUpdateInput:
