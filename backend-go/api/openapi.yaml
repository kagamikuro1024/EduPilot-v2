      required: [version]
      additionalProperties: false
      properties:
        subject_code:
          type: string
        class_code:
          type: string
        name:
          type: string
        semester:
          type: string
        capacity:
          type: [integer, "null"]
        version:
          type: integer
          minimum: 1
    CourseAssignInput:
      type: object
      additionalProperties: false
      properties:
        teacher_id:
          type: string
          format: uuid
        ta_ids:
          type: [array, "null"]
          items:
            type: string
            format: uuid
    AssistantsInput:
      type: object
      required: [ta_ids]
      additionalProperties: false
      properties:
        ta_ids:
          type: array
          items:
            type: string
            format: uuid
