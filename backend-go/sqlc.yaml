version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: internal/store/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          # Tiền là numeric (VND) → decimal.Decimal, cấm float (luật 5, FEAT-llm-gateway 01-AC12).
          - db_type: "pg_catalog.numeric"
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type: github.com/shopspring/decimal.NullDecimal
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          # jsonb PHẢI là json.RawMessage, không phải []byte: pool chạy QueryExecModeExec (PgBouncer) gửi
          # tham số []byte dưới dạng literal bytea `\x…` → Postgres báo "invalid input syntax for type json".
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: jsonb
            nullable: true
            go_type:
              import: encoding/json
              type: RawMessage
