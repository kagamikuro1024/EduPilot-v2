# Override CHỈ để QC chạy `scripts/seed.mjs` trên stack thử (US-P2-12 AC9, Q-QC-P212-1): nới đúng 4 giới hạn theo IP, không gì khác.
# Dùng: docker compose --env-file .env.local -f docker-compose.local.yml -f docker-compose.test.yml -f docker-compose.test-seed.yml -p edupilot up -d gateway
# Sau khi seed xong, tạo lại gateway bằng compose thử THUẦN để thử giới hạn thật trên dữ liệu đã seed:
#   docker compose --env-file .env.local -f docker-compose.local.yml -f docker-compose.test.yml -p edupilot up -d --force-recreate --no-deps gateway
# Không dùng ở CI và không có ở production.
services:
  gateway:
    environment:
      RATE_LIMIT_IP_PER_MIN: "5000"
      AUTH_LOGIN_IP_PER_MIN: "1000"
      AUTH_REGISTER_IP_PER_HOUR: "1000"
      AUTH_TOKEN_IP_PER_MIN: "1000"
